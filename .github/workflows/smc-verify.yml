name: SMC Runtime Verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test_smc_smoke.py'
      - 'bybit_htf_ltf_screener.py'
      - 'run_structural_screener.py'
      - '.github/workflows/smc-verify.yml'
jobs:
  smc-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run SMC smoke tests
        run: python test_smc_smoke.py
