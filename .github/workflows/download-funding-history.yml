name: Download Historical Funding Rates

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests
      - name: Download Binance Vision monthly funding history
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import os, io, zipfile, requests, csv
          from datetime import datetime

          symbols='''1000PEPEUSDT WIFUSDT 1000BONKUSDT 1000SHIBUSDT 1000FLOKIUSDT TRUMPUSDT PENGUUSDT PNUTUSDT NEIROUSDT 1000SATSUSDT 1000RATSUSDT MEMEUSDT BOMEUSDT BRETTUSDT POPCATUSDT MEWUSDT TURBOUSDT MOODENGUSDT ACTUSDT GOATUSDT FARTCOINUSDT TOSHIUSDT KAITOUSDT VIRTUALUSDT SUIUSDT ENAUSDT WLDUSDT APTUSDT SEIUSDT TIAUSDT JUPUSDT ONDOUSDT PYTHUSDT NOTUSDT TONUSDT HMSTRUSDT'''.split()
          shard=int(os.environ['SHARD'])
          symbols=symbols[shard::6]
          os.makedirs('funding', exist_ok=True)

          months=[]
          y,m=2025,1
          end_y,end_m=2026,8
          while (y,m) <= (end_y,end_m):
              months.append((y,m))
              m += 1
              if m == 13:
                  y += 1; m = 1

          sess=requests.Session()
          for sym in symbols:
              out_rows=[]
              header=None
              ok_months=0
              for y,m in months:
                  ym=f'{y:04d}-{m:02d}'
                  url=f'https://data.binance.vision/data/futures/um/monthly/fundingRate/{sym}/{sym}-fundingRate-{ym}.zip'
                  try:
                      r=sess.get(url, timeout=30)
                  except Exception as e:
                      print('ERR', sym, ym, e)
                      continue
                  if r.status_code == 404:
                      continue
                  if r.status_code != 200:
                      print('HTTP', r.status_code, sym, ym)
                      continue
                  try:
                      z=zipfile.ZipFile(io.BytesIO(r.content))
                      names=[n for n in z.namelist() if n.lower().endswith('.csv')]
                      if not names:
                          print('NOCSV', sym, ym)
                          continue
                      text=z.read(names[0]).decode('utf-8-sig').splitlines()
                      rows=list(csv.reader(text))
                      if not rows:
                          continue
                      if header is None:
                          header=rows[0]
                      data=rows[1:] if rows[0] == header else rows
                      out_rows.extend(data)
                      ok_months += 1
                  except Exception as e:
                      print('ZIPERR', sym, ym, e)
              if header is not None:
                  with open(f'funding/{sym}_funding.csv','w',newline='') as f:
                      w=csv.writer(f)
                      w.writerow(header)
                      w.writerows(out_rows)
              print(sym, 'months', ok_months, 'rows', len(out_rows), 'header', header)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: funding-shard-${{ matrix.shard }}
          path: funding/*.csv
          if-no-files-found: warn
          retention-days: 7
