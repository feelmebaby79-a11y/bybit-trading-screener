name: ICT Model Comparative Backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ict_models_backtest.py']
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backtest Bybit ICT model proxies
        run: python ict_models_backtest.py
      - name: Save backtest outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ict-backtest-results
          path: backtest_results/
          if-no-files-found: warn
