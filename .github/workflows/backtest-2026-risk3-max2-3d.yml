name: BTC ETH BNB 2026 Risk3 Max2 3Day Hold
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/backtest-2026-risk3-max2-3d.yml'
permissions:
  contents: read
jobs:
  symbol_backtest:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, BNBUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare 2026 YTD data and signals
        env:
          S: ${{ matrix.symbol }}
        run: |
          set -euo pipefail
          cp entry_trigger.js entry_trigger.mjs
          : > ${S}_5m.csv
          for m in $(seq -w 1 8); do
            u="https://data.binance.vision/data/futures/um/monthly/klines/${S}/5m/${S}-5m-2026-${m}.zip"
            curl -fsSL "$u" -o /tmp/k.zip; unzip -p /tmp/k.zip >> ${S}_5m.csv; printf '\n' >> ${S}_5m.csv
          done
          for d in $(seq -w 1 9); do
            u="https://data.binance.vision/data/futures/um/daily/klines/${S}/5m/${S}-5m-2026-09-${d}.zip"
            curl -fsSL "$u" -o /tmp/k.zip; unzip -p /tmp/k.zip >> ${S}_5m.csv; printf '\n' >> ${S}_5m.csv
          done
          cp ${S}_5m.csv btc5m.csv
          cp backtest_btc_2026_day_swing.mjs bt.mjs
          sed -i "s#'./entry_trigger.js'#'./entry_trigger.mjs'#" bt.mjs
          sed -i "s/const SYMBOL='BTCUSDT'/const SYMBOL='${S}'/" bt.mjs
          sed -i "s#const END=Math.floor((Date.now()-300000)/300000)\*300000;#const END=Date.parse('2026-09-09T02:20:00Z');#" bt.mjs
          node bt.mjs > result_${S}.log
      - uses: actions/upload-artifact@v4
        with:
          name: result-2026-3d-${{ matrix.symbol }}
          path: |
            result_${{ matrix.symbol }}.log
            ${{ matrix.symbol }}_5m.csv
  aggregate:
    needs: symbol_backtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-2026-3d-*
          merge-multiple: true
      - run: node aggregate_2026_risk3_max2_3d.mjs | tee portfolio_2026_3d.log
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-2026-risk3-max2-3d
          path: portfolio_2026_3d.log
