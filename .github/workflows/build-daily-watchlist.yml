name: Build Daily Watchlist

# Canonical watchlist is produced atomically by Bybit HTF LTF Scan.
# This legacy workflow is intentionally manual-only to prevent the old
# version-22 builder from overwriting the canonical version-25 watchlist.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-daily-watchlist-legacy-manual
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify canonical watchlist only
        run: |
          python - <<'PY'
          import json
          w=json.load(open('latest/watchlist.json'))
          p=w.get('policy') or {}
          assert w.get('ok') is True, 'watchlist not ok'
          assert w.get('version') == 25, 'watchlist must be canonical v25'
          assert w.get('scan_fresh_only') is True, 'scan_fresh_only must be true'
          assert p.get('position_fetch_ok') is True, 'position_fetch_ok must be true'
          assert p.get('score_scale') == 100, 'canonical score scale must be 100'
          assert p.get('no_retrace_no_trade') is True, 'no-retrace policy missing'
          assert float(p.get('minimum_rr') or 0) >= 1.5, 'minimum RR invalid'
          print('Canonical watchlist verification OK:', w.get('updated_at'))
          PY
