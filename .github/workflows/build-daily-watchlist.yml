name: Build Daily Watchlist

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Bybit HTF LTF Scan"]
    types: [completed]
  push:
    paths:
      - '.github/workflows/build-daily-watchlist.yml'
      - 'build_daily_watchlist.py'
      - 'watchlist-trigger.txt'

permissions:
  contents: write
  actions: write

concurrency:
  group: build-daily-watchlist-main
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch live Bybit positions
        env:
          WORKER_ACCESS_KEY: ${{ secrets.WORKER_ACCESS_KEY }}
        run: |
          test -n "$WORKER_ACCESS_KEY" || (echo 'Missing WORKER_ACCESS_KEY' && exit 21)
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $WORKER_ACCESS_KEY" \
            -H "Accept: application/json" \
            https://bybit-trading-screener.feelmebaby79.workers.dev/position-symbols \
            -o /tmp/bybit_positions.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/bybit_positions.json'))
          if not p.get('ok'):
              raise SystemExit('live position snapshot failed')
          if not isinstance(p.get('positions'), list):
              raise SystemExit('positions list missing from Worker response')
          print('live positions:', [(x.get('symbol'), x.get('side')) for x in p['positions']])
          PY

      - name: Build watchlist
        env:
          POSITION_SNAPSHOT: /tmp/bybit_positions.json
        run: python build_daily_watchlist.py

      - name: Save watchlist
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add latest/watchlist.json
          if git diff --cached --quiet; then
            echo "No watchlist changes"
          else
            git commit -m "Refresh core plus daily watchlist"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Dispatch realtime monitoring immediately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # workflow_dispatch is intentionally used here because GitHub suppresses
          # workflows triggered by normal pushes made with GITHUB_TOKEN.
          gh workflow run realtime-snapshot.yml --ref main
          echo "Realtime snapshot dispatched immediately after watchlist refresh"
