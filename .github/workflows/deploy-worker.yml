name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'worker_realtime.js'
      - 'worker_with_oi.js'
      - 'worker_sharded.js'
      - 'oi_surge_alert.js'
      - 'entry_trigger.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Publish verification started
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/statuses/$SHA" -d '{"state":"pending","context":"production/live-poi-telegram","description":"Production verification running"}'

      - name: Check Worker JavaScript syntax
        run: |
          node --check worker_sharded.js
          node --check entry_trigger.js

      - name: Validate deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_ACCESS_KEY: ${{ secrets.WORKER_ACCESS_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 11)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 12)
          test -n "$WORKER_ACCESS_KEY" || (echo 'Missing WORKER_ACCESS_KEY' && exit 13)

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy

      - name: Sync Worker access key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_ACCESS_KEY: ${{ secrets.WORKER_ACCESS_KEY }}
        run: |
          printf '%s' "$WORKER_ACCESS_KEY" | npx wrangler@latest secret put WORKER_ACCESS_KEY

      - name: Sync Worker GitHub token if configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
        run: |
          if [ -n "$WORKER_GITHUB_TOKEN" ]; then
            printf '%s' "$WORKER_GITHUB_TOKEN" | npx wrangler@latest secret put GITHUB_TOKEN
            echo 'Worker GITHUB_TOKEN synchronized.'
          else
            echo 'WORKER_GITHUB_TOKEN not configured; preserving existing Worker secret.'
          fi

      - name: Verify deployed POI live scoring marker
        id: marker
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = "https://bybit-trading-screener.feelmebaby79.workers.dev/deployment-status"
          for attempt in range(6):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "bybit-deploy-verifier"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      payload = json.load(response)
                  assert payload.get("ok") is True, payload
                  assert payload.get("poi_live_score") is True, payload
                  assert payload.get("entry_live_score") is True, payload
                  assert payload.get("build_id") == "b86bab3acfadb3eabc9ce18c31e4fea7e43ae70f", payload
                  print("DEPLOYED POI LIVE SCORE VERIFIED:", json.dumps(payload))
                  break
              except Exception:
                  if attempt == 5: raise
                  time.sleep(10)
          PY

      - name: Verify live scoring API on production
        id: score
        run: |
          python - <<'PY'
          import json, urllib.request
          base="https://bybit-trading-screener.feelmebaby79.workers.dev"
          seen=0
          for shard in range(12):
              url=f"{base}/realtime-watch?shards=12&shard={shard}"
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"live-score-verifier"}),timeout=90) as response:
                  payload=json.load(response)
              assert payload.get("ok") is True, payload
              assert payload.get("error_count")==0, (shard,payload.get("error_count"))
              for item in payload.get("arrivals",[]):
                  parts=item.get("score_breakdown")
                  assert item.get("score_mode")=="LIVE_APPROXIMATION_NOT_LUXALGO_VERIFIED",item
                  assert isinstance(parts,dict) and len(parts)==7,item
                  assert abs(sum(parts.values())-item["score"])<0.011,item
                  assert item.get("score_updated_at"),item
                  seen+=1
          print("Live scoring API verified; POI arrivals observed:",seen)
          if seen==0:print("No natural POI arrivals: end-to-end live alert scoring remains UNVERIFIED")
          PY

      - name: Smoke test authenticated position lookup
        env:
          WORKER_ACCESS_KEY: ${{ secrets.WORKER_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = "https://bybit-trading-screener.feelmebaby79.workers.dev/position-symbols"
          req = urllib.request.Request(url, headers={"Accept":"application/json","Authorization":"Bearer "+os.environ["WORKER_ACCESS_KEY"],"User-Agent":"bybit-worker-deploy-smoke-test"})
          with urllib.request.urlopen(req, timeout=30) as response:
              payload=json.loads(response.read().decode("utf-8"))
          if not payload.get("ok"): raise SystemExit("position-symbols smoke test failed: "+repr(payload))
          if not isinstance(payload.get("positions"), list): raise SystemExit("position-symbols positions payload missing")
          print("position-symbols smoke test OK")
          print("positions:", [(x.get("symbol"), x.get("side")) for x in payload.get("positions", [])])
          PY

      - name: Smoke test scan endpoint
        run: |
          python - <<'PY'
          import json, urllib.request
          url="https://bybit-trading-screener.feelmebaby79.workers.dev/scan"
          req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"bybit-worker-scan-smoke-test"})
          with urllib.request.urlopen(req,timeout=30) as response:
              payload=json.loads(response.read().decode("utf-8"))
          if not payload.get("generated_at"): raise SystemExit("scan smoke test failed: generated_at missing")
          if "position_fetch_ok" not in payload: raise SystemExit("scan smoke test failed: position_fetch_ok missing")
          if not isinstance(payload.get("position_symbols"),list): raise SystemExit("scan smoke test failed: position_symbols is not a list")
          print("scan endpoint smoke test OK")
          PY

      - name: One-shot run-scan trigger test
        if: contains(github.event.head_commit.message, '[scan-smoke]')
        run: |
          python - <<'PY'
          import json, urllib.request
          url="https://bybit-trading-screener.feelmebaby79.workers.dev/run-scan"
          req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"bybit-worker-run-scan-smoke-test"})
          with urllib.request.urlopen(req,timeout=30) as response:
              payload=json.loads(response.read().decode("utf-8"))
          if not payload.get("ok") or payload.get("status")!="started": raise SystemExit("run-scan trigger failed: "+repr(payload))
          print("run-scan trigger OK")
          PY

      - name: Send one-shot Telegram transport test
        id: telegram
        if: contains(github.event.head_commit.message, '[telegram-test]')
        env:
          WORKER_ACCESS_KEY: ${{ secrets.WORKER_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url="https://bybit-trading-screener.feelmebaby79.workers.dev/test-poi-telegram?symbol=BTCUSDT"
          req=urllib.request.Request(url,method="POST",headers={"Accept":"application/json","Authorization":"Bearer "+os.environ["WORKER_ACCESS_KEY"],"User-Agent":"bybit-worker-telegram-test"})
          with urllib.request.urlopen(req,timeout=30) as response:
              payload=json.loads(response.read().decode("utf-8"))
          if not payload.get("ok") or not payload.get("telegram_sent"): raise SystemExit("telegram test failed: "+repr(payload))
          print("telegram transport test OK")
          PY

      - name: Publish production verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RESULT: ${{ job.status }}
          FAILED_STAGE: deploy=${{ steps.deploy.outcome }},marker=${{ steps.marker.outcome }},score=${{ steps.score.outcome }},telegram=${{ steps.telegram.outcome }}
        run: |
          if [ "$RESULT" = "success" ]; then STATE=success; DESC="Deployment and Telegram transport checks passed"; else STATE=failure; DESC="Failed stage: $FAILED_STAGE"; fi
          printf '{"state":"%s","context":"production/live-poi-telegram","description":"%s"}' "$STATE" "$DESC" > /tmp/verification-status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/statuses/$SHA" --data-binary @/tmp/verification-status.json
