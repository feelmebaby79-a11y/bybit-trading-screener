name: BTC 2026 Day Swing Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_btc_2026_day_swing.mjs'
      - '.github/workflows/backtest-btc-final.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare optimized ESM backtest
        run: |
          cp entry_trigger.js entry_trigger.mjs
          sed -i "s#'./entry_trigger.js'#'./entry_trigger.mjs'#" backtest_btc_2026_day_swing.mjs
          sed -i 's/function asianLevels(all5,t,width)/function asianLevels(a15,t,width)/' backtest_btc_2026_day_swing.mjs
          sed -i 's/const bars=all5.filter(c=>c.start>=asiaStart&&c.start<asiaEnd)/const bars=a15.filter(c=>c.start>=asiaStart\&\&c.start<asiaEnd)/' backtest_btc_2026_day_swing.mjs
          sed -i 's/asianLevels(all5,t,w)/asianLevels(a15,t,w)/' backtest_btc_2026_day_swing.mjs
      - name: Download BTCUSDT 5m history with warmup
        run: |
          : > btc5m.csv
          for i in $(seq 0 300); do
            d=$(date -u -d "-$i day" +%F)
            u="https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/5m/BTCUSDT-5m-${d}.zip"
            if curl -fsSL "$u" -o /tmp/k.zip; then
              unzip -p /tmp/k.zip >> btc5m.csv
              printf '\n' >> btc5m.csv
            fi
          done
          test -s btc5m.csv
          wc -l btc5m.csv
      - name: Run 2026 expanded DAY and SWING backtest
        run: node backtest_btc_2026_day_swing.mjs
