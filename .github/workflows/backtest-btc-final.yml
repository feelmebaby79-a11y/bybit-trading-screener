name: Top5 Crypto 2026 Day Swing Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_btc_2026_day_swing.mjs'
      - 'aggregate_top5_2026.mjs'
      - '.github/workflows/backtest-btc-final.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ESM entry module
        run: cp entry_trigger.js entry_trigger.mjs
      - name: Run five-coin backtests
        run: |
          set -e
          for s in BTCUSDT ETHUSDT BNBUSDT XRPUSDT SOLUSDT; do
            echo "=== $s ==="
            : > ${s}_5m.csv
            for i in $(seq 0 300); do
              d=$(date -u -d "-$i day" +%F)
              u="https://data.binance.vision/data/futures/um/daily/klines/${s}/5m/${s}-5m-${d}.zip"
              if curl -fsSL "$u" -o /tmp/k.zip; then
                unzip -p /tmp/k.zip >> ${s}_5m.csv
                printf '\n' >> ${s}_5m.csv
              fi
            done
            test -s ${s}_5m.csv
            cp ${s}_5m.csv btc5m.csv
            cp backtest_btc_2026_day_swing.mjs bt_${s}.mjs
            sed -i "s#'./entry_trigger.js'#'./entry_trigger.mjs'#" bt_${s}.mjs
            sed -i "s/const SYMBOL='BTCUSDT'/const SYMBOL='${s}'/" bt_${s}.mjs
            sed -i 's/function asianLevels(all5,t,width)/function asianLevels(a15,t,width)/' bt_${s}.mjs
            sed -i 's/const bars=all5.filter(c=>c.start>=asiaStart&&c.start<asiaEnd)/const bars=a15.filter(c=>c.start>=asiaStart\&\&c.start<asiaEnd)/' bt_${s}.mjs
            sed -i 's/asianLevels(all5,t,w)/asianLevels(a15,t,w)/' bt_${s}.mjs
            node bt_${s}.mjs > result_${s}.log
            grep -A 45 'BACKTEST_RESULT_START' result_${s}.log | head -50 || true
          done
      - name: Aggregate top-5 portfolio
        run: node aggregate_top5_2026.mjs
