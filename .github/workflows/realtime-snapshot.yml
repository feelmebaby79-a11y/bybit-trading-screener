name: Realtime POI Snapshot

on:
  push:
    paths:
      - 'realtime-trigger.txt'
  workflow_dispatch:
  workflow_run:
    workflows: ["Bybit HTF LTF Scan", "Realtime Watch Health Check"]
    types: [completed]
  schedule:
    # Best-effort schedule; the hourly health-check completion is a secondary trigger.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  contents: write

concurrency:
  group: realtime-poi-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.name == 'Realtime Watch Health Check' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch, merge and validate realtime and entry shards
        run: |
          set -euo pipefail
          mkdir -p latest
          python - <<'PY'
          import json, time, urllib.request
          from datetime import datetime, timezone
          BASE='https://bybit-trading-screener.feelmebaby79.workers.dev'; SHARDS=256
          # Official Bybit perpetual-contract delistings; UTC effective times.
          # VELODROME: https://announcements.bybit.global/en/article/delisting-of-velodromeusdt-perpetual-contract--artb784434995a7/
          # MITO: https://announcements.bybit.com/en/article/delisting-of-mitousdt-perpetual-contract--art87127dd56942/
          # EPIC: https://announcements.bybit.com/en/article/delisting-of-epicusdt-perpetual-contract--artfddc9a184576/
          # PTB: https://announcements.bybit.com/en/article/delisting-of-ptbusdt-perpetual-contract--art471fb03ab350/
          official_delistings={
              'VELODROMEUSDT':datetime(2026,10,27,9,tzinfo=timezone.utc),
              'MITOUSDT':datetime(2026,10,30,9,tzinfo=timezone.utc),
              'EPICUSDT':datetime(2026,10,30,9,tzinfo=timezone.utc),
              'PTBUSDT':datetime(2026,10,30,9,tzinfo=timezone.utc),
          }
          def fetch_json(url):
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'realtime-shard-snapshot'})
              with urllib.request.urlopen(req,timeout=60) as r: return json.loads(r.read().decode('utf-8'))
          def fetch_watchlist(): return fetch_json(f'{BASE}/watchlist')
          def parse_ts(v):
              if not v: raise RuntimeError('missing timestamp')
              return datetime.fromisoformat(str(v).replace('Z','+00:00')).astimezone(timezone.utc)
          def merge(kind):
              parts=[]
              for shard in range(SHARDS):
                  p=None
                  for shard_attempt in range(1,5):
                      try:
                          p=fetch_json(f'{BASE}/{kind}?shard={shard}&shards={SHARDS}')
                          errors=[{'symbol':x.get('symbol'),'error':x.get('error')} for x in p.get('items',[]) if x.get('error')]
                          if p.get('ok') is not True:
                              raise RuntimeError(f'worker not ok: {p.get("error")}')
                          # Exclude only exact invalid-ticker errors for officially delisted
                          # contracts after the effective time; preserve audit counts.
                          valid_exclusions={
                              e.get('symbol') for e in errors
                              if e.get('symbol') in official_delistings
                              and e.get('error')==f"Invalid ticker {e.get('symbol')}"
                              and datetime.now(timezone.utc)>=official_delistings[e.get('symbol')]
                          }
                          if (errors and len(valid_exclusions)==len(errors)
                              and int(p.get('error_count') or 0)==len(errors)):
                              p['items']=[x for x in (p.get('items') or []) if x.get('symbol') not in valid_exclusions]
                              for key in ('arrivals','candidates'):
                                  p[key]=[x for x in (p.get(key) or []) if x.get('symbol') not in valid_exclusions]
                              p['error_count']=0
                              p['excluded_delisted_symbols']=sorted(set(p.get('excluded_delisted_symbols') or [])|valid_exclusions)
                              print(f'{kind} shard={shard}: official delisting exclusions {sorted(valid_exclusions)}',flush=True)
                          elif int(p.get('error_count') or 0)!=0 or errors:
                              raise RuntimeError(f'ok={p.get("ok")} error_count={p.get("error_count")} worker_error={p.get("error")} sample_errors={errors[:5]}')
                          break
                      except Exception as exc:
                          print(f'{kind} shard={shard} attempt={shard_attempt}/4 failure={exc}',flush=True)
                          if shard_attempt==4: raise RuntimeError(f'{kind} shard {shard} failed after retries: {exc}') from exc
                          time.sleep(2*shard_attempt)
                  parts.append(p)
              watch_times={p.get('watchlist_updated_at') for p in parts}
              if len(watch_times)!=1: raise RuntimeError(f'{kind}: inconsistent watchlist timestamps: {watch_times}')
              items=[x for p in parts for x in (p.get('items') or [])]
              key='arrivals' if kind=='realtime-watch' else 'candidates'
              excluded=sorted(set(x for p in parts for x in p.get('excluded_delisted_symbols',[])))
              return {'ok':True,'generated_at':max(p.get('generated_at') for p in parts),'watchlist_updated_at':parts[0].get('watchlist_updated_at'),'execution_mode':'sharded_merge','shard_count':SHARDS,'error_count':0,'excluded_delisted_symbols':excluded,'watchlist_item_count':len(items)+len(excluded),key:[x for p in parts for x in (p.get(key) or [])],'items':items}
          last_error=None
          for attempt in range(1,4):
              try:
                  realtime=merge('realtime-watch'); entry=merge('entry-watch')
                  # One shard may not request a ticker in entry mode, so mirror the
                  # independently detected official delisting across both outputs.
                  excluded=set(realtime['excluded_delisted_symbols'])|set(entry['excluded_delisted_symbols'])
                  if not excluded.issubset(set(official_delistings)):
                      raise RuntimeError(f'unexpected delisting exclusions: {excluded}')
                  for data,key in ((realtime,'arrivals'),(entry,'candidates')):
                      if excluded:
                          data['items']=[x for x in data['items'] if x.get('symbol') not in excluded]
                          data[key]=[x for x in data[key] if x.get('symbol') not in excluded]
                          data['excluded_delisted_symbols']=sorted(excluded)
                          data['watchlist_item_count']=len(data['items'])+len(excluded)
                  expected=realtime.get('watchlist_updated_at')
                  if entry.get('watchlist_updated_at')!=expected: raise RuntimeError('realtime/entry watchlist mismatch')
                  age=max((datetime.now(timezone.utc)-datetime.fromisoformat(x['generated_at'].replace('Z','+00:00')).astimezone(timezone.utc)).total_seconds() for x in (realtime,entry))
                  if age>600: raise RuntimeError(f'stale snapshot age={age:.0f}s')
                  current=fetch_watchlist()
                  if current.get('ok') is not True: raise RuntimeError('worker watchlist not ok')
                  expected_symbols={x.get('symbol') for x in (current.get('items') or [])}
                  if not expected_symbols: raise RuntimeError('empty canonical watchlist')
                  if realtime['excluded_delisted_symbols']!=entry['excluded_delisted_symbols']:
                      raise RuntimeError('realtime/entry delisted exclusions differ')
                  for name,data in (('realtime',realtime),('entry',entry)):
                      actual=[x.get('symbol') for x in data['items']]
                      if len(actual)!=len(set(actual)): raise RuntimeError(f'{name}: duplicate symbols')
                      if set(actual)|set(data['excluded_delisted_symbols'])!=expected_symbols:
                          raise RuntimeError(f'{name}: processed+excluded symbols do not match canonical watchlist')
                      if set(actual)&set(data['excluded_delisted_symbols']):
                          raise RuntimeError(f'{name}: excluded symbol still in processed items')
                      if data['watchlist_item_count']!=len(expected_symbols):
                          raise RuntimeError(f'{name}: watchlist count mismatch')
                  current_updated=current.get('updated_at')
                  if not current_updated: raise RuntimeError('worker watchlist missing updated_at')
                  if current_updated!=expected: raise RuntimeError(f'watchlist changed during snapshot: worker={expected} current={current_updated}')
                  # Hard freshness gate: realtime/ENTRY may only use today's fresh watchlist.
                  now=datetime.now(timezone.utc)
                  wl_age=(now-parse_ts(current_updated)).total_seconds()
                  if wl_age<0 or wl_age>86400: raise RuntimeError(f'stale watchlist age={wl_age:.0f}s')
                  policy=current.get('policy') or {}
                  if policy.get('position_fetch_ok') is not True: raise RuntimeError('watchlist position_fetch_ok != true')
                  pf=policy.get('position_fetched_at')
                  pf_age=(now-parse_ts(pf)).total_seconds()
                  if pf_age<0 or pf_age>86400: raise RuntimeError(f'stale position_fetched_at age={pf_age:.0f}s')
                  if current.get('scan_fresh_only') is not True: raise RuntimeError('watchlist scan_fresh_only != true')
                  if int(policy.get('score_scale') or 0)!=100: raise RuntimeError('watchlist canonical score scale is not 100')
                  if policy.get('no_retrace_no_trade') is not True or float(policy.get('minimum_rr') or 0)<1.5: raise RuntimeError('entry policy gate invalid')
                  break
              except Exception as exc:
                  last_error=exc
                  if attempt==3: raise
                  print(f'Attempt {attempt}/3 invalid due to {exc}; waiting for Worker watchlist convergence')
                  time.sleep(5)
          with open('latest/realtime_watch.json','w',encoding='utf-8') as f: json.dump(realtime,f,ensure_ascii=False,separators=(',',':'))
          with open('latest/entry_watch.json','w',encoding='utf-8') as f: json.dump(entry,f,ensure_ascii=False,separators=(',',':'))
          print('snapshot OK watchlist_updated_at=',expected,'realtime items=',len(realtime['items']),'entry items=',len(entry['items']))
          PY

      - name: Save snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          tmpdir="$(mktemp -d)"
          cp latest/realtime_watch.json latest/entry_watch.json "$tmpdir/"
          git fetch origin main
          git reset --hard origin/main
          cp "$tmpdir/realtime_watch.json" latest/realtime_watch.json
          cp "$tmpdir/entry_watch.json" latest/entry_watch.json
          git add latest/realtime_watch.json latest/entry_watch.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "Update sharded realtime and entry snapshots"
            git push origin HEAD:main
          fi
