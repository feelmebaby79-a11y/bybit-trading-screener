name: Bybit HTF LTF Scan

on:
  workflow_dispatch:
  schedule:
    # 매일 한국시간 오전 9시
    - cron: "0 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run screener
        run: |
          python bybit_htf_ltf_screener.py \
            --max-symbols 160 \
            --min-turnover 5000000 \
            --top 15 \
            --output scan_results.csv

      - name: Build latest files
        run: |
          mkdir -p latest

          cp scan_results.csv latest/scan_results.csv
          cp scan_results_long.csv latest/scan_results_long.csv
          cp scan_results_short.csv latest/scan_results_short.csv

          python - <<'PY'
          import csv
          import json
          import urllib.request
          from datetime import datetime, timezone

          def read_csv(path):
              with open(path, "r", encoding="utf-8-sig") as f:
                  return list(csv.DictReader(f))

          def convert_value(value):
              if value is None or value == "":
                  return None

              lower = str(value).lower()

              if lower == "true":
                  return True

              if lower == "false":
                  return False

              try:
                  return float(value)
              except (ValueError, TypeError):
                  return value

          def clean(rows):
              return [
                  {
                      key: convert_value(value)
                      for key, value in row.items()
                  }
                  for row in rows
              ]

          full = clean(read_csv("scan_results.csv"))
          longs = clean(read_csv("scan_results_long.csv"))
          shorts = clean(read_csv("scan_results_short.csv"))

          # ==========================================================
          # BTC / COMP 보유종목 데이터는 추천 후보 필터와 별도로 보존
          # ==========================================================

          position_symbols = {
              "BTCUSDT",
              "COMPUSDT"
          }

          # TOP100 전체 스캔 결과에 해당 종목이 존재하면
          # 스크리너 분석 결과도 같이 저장
          position_analysis = {
              row.get("symbol"): row
              for row in full
              if row.get("symbol") in position_symbols
          }

          # ==========================================================
          # BTC / COMP 최신 Bybit 5TF raw candle 강제 수집
          #
          # 1D / 4H / 1H / 15m / 5m
          # 각 200 candles
          #
          # TOP100 / long / short 후보 포함 여부와 무관
          # ==========================================================

          worker_base = (
              "https://bybit-trading-screener."
              "feelmebaby79.workers.dev"
          )

          def fetch_position_market(symbol):
              url = (
                  f"{worker_base}/"
                  f"?symbol={symbol}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent":
                          "bybit-trading-screener-github-actions"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  payload = json.loads(
                      response.read().decode("utf-8")
                  )

              if not payload.get("ok"):
                  raise RuntimeError(
                      f"Market fetch failed "
                      f"for {symbol}: {payload}"
                  )

              return payload

          position_market = {}

          for symbol in sorted(position_symbols):
              try:
                  position_market[symbol] = (
                      fetch_position_market(symbol)
                  )

              except Exception as exc:
                  # 보유종목 데이터 한 개가 일시적으로 실패해도
                  # 전체 TOP100 스캔 결과는 보존
                  position_market[symbol] = {
                      "ok": False,
                      "symbol": symbol,
                      "error": str(exc)
                  }

          # ==========================================================
          # Final scan.json
          # ==========================================================

          data = {
              "ok": True,

              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),

              "source":
                  "Bybit V5 via Cloudflare",

              "scan_method":
                  "1D > 4H > 1H > 15m > 5m",

              "universe_count": len(full),

              # ----------------------------------------------
              # 보유종목 전용 데이터
              # ----------------------------------------------
              "positions": {
                  "BTCUSDT": {
                      "analysis":
                          position_analysis.get(
                              "BTCUSDT"
                          ),
                      "market":
                          position_market.get(
                              "BTCUSDT"
                          )
                  },

                  "COMPUSDT": {
                      "analysis":
                          position_analysis.get(
                              "COMPUSDT"
                          ),
                      "market":
                          position_market.get(
                              "COMPUSDT"
                          )
                  }
              },

              # ----------------------------------------------
              # 추천 후보
              # ----------------------------------------------
              "longs": longs,
              "shorts": shorts
          }

          with open(
              "latest/scan.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Created latest/scan.json"
          )

          print(
              "Universe:",
              len(full)
          )

          print(
              "Long candidates:",
              len(longs)
          )

          print(
              "Short candidates:",
              len(shorts)
          )

          print(
              "BTC position data:",
              position_market.get(
                  "BTCUSDT",
                  {}
              ).get("ok")
          )

          print(
              "COMP position data:",
              position_market.get(
                  "COMPUSDT",
                  {}
              ).get("ok")
          )
          PY

      - name: Create Pages site
        run: |
          mkdir -p public/latest

          cp latest/scan.json public/latest/scan.json
          cp latest/scan_results.csv public/latest/scan_results.csv
          cp latest/scan_results_long.csv public/latest/scan_results_long.csv
          cp latest/scan_results_short.csv public/latest/scan_results_short.csv

          cat > public/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Bybit HTF LTF Screener</title>
          </head>

          <body>
            <h1>Bybit HTF/LTF Screener</h1>

            <p>
              Latest scan is available.
            </p>

            <p>
              <a href="./latest/scan.json">
                Open latest scan.json
              </a>
            </p>
          </body>
          </html>
          EOF

      - name: Save latest results to repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add latest/

          if git diff --cached --quiet; then
            echo "No repository changes"
          else
            git commit -m "Update latest Bybit scan"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
