name: Bybit HTF LTF Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run screener
        run: |
          python bybit_htf_ltf_screener.py \
            --max-symbols 160 \
            --min-turnover 5000000 \
            --top 15 \
            --output scan_results.csv

      - name: Save latest scan files
        run: |
          mkdir -p latest
          cp scan_results.csv latest/scan_results.csv
          cp scan_results_long.csv latest/scan_results_long.csv
          cp scan_results_short.csv latest/scan_results_short.csv

      - name: Commit scan results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add latest/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Bybit scan results"
            git push
          fi
