name: Bybit HTF LTF Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # 매일 한국시간 오전 8시 51분 — 09:00 브리핑 전에 fresh scan 확보
    - cron: "51 23 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "bybit-htf-ltf-scan-main"
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run screener
        run: |
          python run_structural_screener.py \
            --max-symbols 160 \
            --min-turnover 0 \
            --top 15 \
            --output scan_results.csv

      - name: Apply BTC-relative strength reranking
        run: |
          python relative_strength_rerank.py \
            --input scan_results.csv \
            --top 15

      - name: Build latest files
        env:
          WORKER_ACCESS_KEY: ${{ secrets.WORKER_ACCESS_KEY }}
        run: |
          mkdir -p latest
          cp scan_results.csv latest/scan_results.csv
          cp scan_results_long.csv latest/scan_results_long.csv
          cp scan_results_short.csv latest/scan_results_short.csv
          python - <<'PY'
          import csv, json, os, urllib.request
          from datetime import datetime, timezone
          WORKER_BASE = "https://bybit-trading-screener.feelmebaby79.workers.dev"
          WORKER_ACCESS_KEY = os.environ.get("WORKER_ACCESS_KEY", "").strip()
          def read_csv(path):
              with open(path, "r", encoding="utf-8-sig") as f: return list(csv.DictReader(f))
          def convert_value(value):
              if value is None or value == "": return None
              lower=str(value).lower()
              if lower=="true": return True
              if lower=="false": return False
              try: return float(value)
              except (ValueError,TypeError): return value
          def clean(rows): return [{k:convert_value(v) for k,v in row.items()} for row in rows]
          def fetch_json(url,headers=None,timeout=30):
              h={"Accept":"application/json","User-Agent":"bybit-trading-screener-github-actions"}
              if headers: h.update(headers)
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=timeout) as r: return json.loads(r.read().decode("utf-8"))
          def fetch_position_symbols():
              if not WORKER_ACCESS_KEY: raise RuntimeError("WORKER_ACCESS_KEY GitHub secret is missing")
              p=fetch_json(f"{WORKER_BASE}/position-symbols",headers={"Authorization":"Bearer "+WORKER_ACCESS_KEY})
              if not p.get("ok"): raise RuntimeError("Position symbol fetch failed: "+str(p))
              symbols=p.get("symbols",[])
              if not isinstance(symbols,list): raise RuntimeError("Invalid position symbols payload")
              return sorted(set(str(s).strip().upper() for s in symbols if str(s).strip().upper().endswith("USDT")))
          def fetch_position_market(symbol):
              p=fetch_json(f"{WORKER_BASE}/?symbol={symbol}")
              if not p.get("ok"): raise RuntimeError(f"Market fetch failed for {symbol}: {p}")
              return p
          full=clean(read_csv("scan_results.csv")); longs=clean(read_csv("scan_results_long.csv")); shorts=clean(read_csv("scan_results_short.csv"))
          analysis_by_symbol={str(r.get("symbol")).upper():r for r in full if r.get("symbol")}
          try: position_symbols=fetch_position_symbols(); position_fetch_ok=True; position_fetch_error=None
          except Exception as exc: position_symbols=[]; position_fetch_ok=False; position_fetch_error=str(exc)
          positions={}
          for symbol in position_symbols:
              try: market=fetch_position_market(symbol); market_ok=True; market_error=None
              except Exception as exc: market=None; market_ok=False; market_error=str(exc)
              positions[symbol]={"symbol":symbol,"in_recommendation_scan":symbol in analysis_by_symbol,"analysis":analysis_by_symbol.get(symbol),"market":market,"market_ok":market_ok,"market_error":market_error}
          position_fetched_at=datetime.now(timezone.utc).isoformat()\n          data={"ok":True,"generated_at":datetime.now(timezone.utc).isoformat(),"position_fetched_at":position_fetched_at,"source":"Bybit V5 via Cloudflare","scan_method":"1D > 4H > 1H > 15m > 5m + BTC relative strength","universe_count":len(full),"position_fetch_ok":position_fetch_ok,"position_fetch_error":position_fetch_error,"position_count":len(position_symbols),"position_symbols":position_symbols,"positions":positions,"longs":longs,"shorts":shorts}
          with open("latest/scan.json","w",encoding="utf-8") as f: json.dump(data,f,ensure_ascii=False,indent=2)
          if os.path.getsize("latest/scan.json") < 100: raise SystemExit("latest/scan.json unexpectedly empty")
          print("Created latest/scan.json",os.path.getsize("latest/scan.json"),"bytes")
          print("Universe:",len(full),"Positions:",position_symbols,"position_fetch_ok:",position_fetch_ok)
          PY

      - name: Rebuild watchlist with canonical 100-point score
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open("latest/scan.json",encoding="utf-8") as f: scan=json.load(f)
          if not scan.get("ok") or not scan.get("position_fetch_ok"): raise SystemExit("REFUSE STALE WATCHLIST: private position fetch failed")
          generated=scan.get("generated_at"); pf=scan.get("position_fetched_at") or generated
          if not generated or not pf: raise SystemExit("REFUSE STALE WATCHLIST: freshness timestamp missing")
          def b(v): return bool(v)
          def n(v,d=0.0):
              try:return float(v)
              except:return d
          def canonical(r,side):
              p=side.lower(); opp="bearish" if side=="LONG" else "bullish"; trend="bullish" if side=="LONG" else "bearish"
              # 25 HTF: 1D 13 + 4H 12
              htf=(13 if r.get("1D")==trend else 0)+(12 if r.get("4H")==trend else 0)
              # 15 1H structure/location: trend 8 + favorable dealing range 7, equilibrium 4
              loc=str(r.get("1H_location") or "").lower(); fav=(loc=="discount" if side=="LONG" else loc=="premium")
              oneh=(8 if r.get("1H")==trend else 0)+(7 if fav else (4 if loc=="equilibrium" else 0))
              # 20 15m ICT: direction 5 + sweep 5 + MSS 5 + displacement 5
              ict=(5 if r.get("15m")==trend else 0)+(5 if b(r.get(p+"_sweep15")) else 0)+(5 if b(r.get(p+"_mss15")) else 0)+(5 if b(r.get(p+"_disp15")) else 0)
              # 15 5m FVG/OB + retracement/readiness
              fvg=str(r.get(p+"_fvg5") or "").lower(); fvgok=(fvg==trend)
              five=(5 if fvgok else 0)+(10 if b(r.get(p+"_entry_model_ready")) else 0)
              # 10 entry location/chase
              chase=max(0,n(r.get(p+"_chase_penalty"))); entryloc=(7 if fav else (4 if loc=="equilibrium" else 0))+max(0,3-min(3,chase))
              # 10 RR
              rr=n(r.get(p+"_rr"),0); rrpts=10 if rr>=2 else (8 if rr>=1.5 else (4 if rr>=1 else 0))
              # 5 BTC environment/relative strength: positive in >=2 horizons
              rs=[n(r.get("rs_vs_btc_30m_pct")),n(r.get("rs_vs_btc_1h_pct")),n(r.get("rs_vs_btc_4h_pct"))]
              good=sum((x>0 if side=="LONG" else x<0) for x in rs); env=5 if good>=2 else (2 if good==1 else 0)
              parts={"HTF":htf,"1H_STRUCTURE_LOCATION":oneh,"15M_ICT":ict,"5M_FVG_OB_RETRACE":five,"ENTRY_LOCATION_CHASE":entryloc,"RR":rrpts,"BTC_MARKET_ENV":env}
              return round(sum(parts.values()),2),parts
          rows=[]
          for side,key in (("LONG","longs"),("SHORT","shorts")):
              for src in scan.get(key,[]):
                  r=dict(src); score,parts=canonical(r,side); r["_side"]=side;r["_score100"]=score;r["_parts"]=parts;rows.append(r)
          bysym={}
          for r in rows:
              s=str(r.get("symbol","")).upper()
              if s and (s not in bysym or r["_score100"]>bysym[s]["_score100"]): bysym[s]=r
          defaults=["BTCUSDT","ETHUSDT","XRPUSDT","SOLUSDT","BNBUSDT"]; positions=scan.get("position_symbols") or []; items=[]; seen=set()
          def add(sym,bucket,r=None):
              sym=sym.upper(); r=r or bysym.get(sym,{}); side=r.get("_side","LONG"); key=(sym,bucket)
              if key in seen:return
              seen.add(key); items.append({"symbol":sym,"direction":side,"score":r.get("_score100"),"score_scale":100,"score_breakdown":r.get("_parts"),"poi_low":None,"poi_high":None,"status":"ACTIVE","bucket":bucket,"trigger_model":"1H/15m POI -> 5m liquidity sweep -> MSS/CHoCH + displacement -> strict FVG/validated OB first retracement -> live RR >= 1.5","updated_at":generated})
          for s in defaults:add(s,"DEFAULT")
          for s in positions:add(s,"CURRENT_POSITION")
          eligible=[]
          for r in rows:
              if str(r.get("symbol","")).upper() in positions: continue
              side=r["_side"]; loc=str(r.get("1H_location") or "").lower(); rr=n(r.get(side.lower()+"_rr"),0)
              if (side=="LONG" and loc=="premium") or (side=="SHORT" and loc=="discount"): continue
              if rr<1.5: continue
              eligible.append(r)
          eligible.sort(key=lambda x:x["_score100"],reverse=True); recs=eligible[:3]
          for r in recs:add(str(r["symbol"]),"DAILY_RECOMMENDATION",r)
          # Early Momentum: separate, no forced picks, max 3; HTF aligned + 1H correction + 15m return + RS >=2 horizons.
          early=[]
          for r in rows:
              side=r["_side"]; p=side.lower(); trend="bullish" if side=="LONG" else "bearish"; corr="bearish" if side=="LONG" else "bullish"
              if r.get("1D")!=trend or r.get("4H")!=trend or r.get("1H")!=corr or r.get("15m")!=trend: continue
              rs=[n(r.get("rs_vs_btc_30m_pct")),n(r.get("rs_vs_btc_1h_pct")),n(r.get("rs_vs_btc_4h_pct"))]; good=sum((x>0 if side=="LONG" else x<0) for x in rs)
              if good<2: continue
              early.append(r)
          early.sort(key=lambda x:x["_score100"],reverse=True); early=early[:3]
          for r in early:add(str(r["symbol"]),"EARLY_MOMENTUM",r)
          wl={"ok":True,"version":25,"updated_at":generated,"scan_fresh_only":True,"policy":{"mode":"CANONICAL_100_CORE_LIVE_POSITIONS_CURRENT_SCAN_EARLY_MOMENTUM","position_source":"Bybit Private Position API via Worker","position_fetch_ok":True,"position_symbols":positions,"position_fetched_at":pf,"score_scale":100,"score_formula":"HTF25+1H15+15mICT20+5m15+entry10+RR10+BTCenv5","daily_recommendation_count":len(recs),"early_momentum_count":len(early),"early_momentum_max":3,"early_momentum_no_forced_pick":True,"no_retrace_no_trade":True,"minimum_rr":1.5},"items":items}
          with open("latest/watchlist.json","w",encoding="utf-8") as f:json.dump(wl,f,ensure_ascii=False,indent=2)
          print("WATCHLIST100",generated,"positions",positions,"daily",[(x["symbol"],x["_side"],x["_score100"]) for x in recs],"early",[(x["symbol"],x["_side"],x["_score100"]) for x in early])
          PY

      - name: Create Pages site
        run: |
          mkdir -p public/latest
          cp latest/scan.json public/latest/scan.json
          cp latest/scan_results.csv public/latest/scan_results.csv
          cp latest/scan_results_long.csv public/latest/scan_results_long.csv
          cp latest/scan_results_short.csv public/latest/scan_results_short.csv
          cat > public/index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><title>Bybit HTF LTF Screener</title></head><body><h1>Bybit HTF/LTF Screener</h1><p>Latest scan is available.</p><p><a href="./latest/scan.json">Open latest scan.json</a></p></body></html>
          EOF

      - name: Save latest results to repository
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          tmpdir="$(mktemp -d)"
          cp -a latest/. "$tmpdir/"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p latest
            cp -a "$tmpdir/." latest/
            test -s latest/scan.json || { echo "Refusing to commit empty scan.json"; exit 1; }
            git add latest/
            if git diff --cached --quiet; then echo "No repository changes"; break; fi
            git commit -m "Update latest Bybit scan [skip actions]"
            if git push origin HEAD:main; then echo "Scan results pushed successfully"; break; fi
            if [ "$attempt" -eq 5 ]; then echo "Failed to push scan results after 5 attempts"; exit 1; fi
            echo "Concurrent main update detected; retrying from origin/main ($attempt/5)"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
