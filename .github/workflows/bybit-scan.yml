name: Bybit HTF-LTF Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "50 23 * * *"

jobs:
  scan:
    runs-on: self-hosted

    permissions:
      contents: write

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Bybit screener
        run: python bybit_htf_ltf_screener.py --max-symbols 400 --min-turnover 3000000 --top 20 --output scan_results.csv

      - name: Save latest scan results
        run: |
          if not exist latest mkdir latest
          copy /Y scan_results.csv latest\scan_results.csv
          copy /Y scan_results_long.csv latest\scan_results_long.csv
          copy /Y scan_results_short.csv latest\scan_results_short.csv

      - name: Save scan timestamp
        run: echo %DATE% %TIME%>latest\updated_at.txt

      - name: Commit scan results
        run: |
          git config user.name "bybit-screener-bot"
          git config user.email "bybit-screener-bot@users.noreply.github.com"
          git add latest
          git diff --cached --quiet || git commit -m "Update Bybit HTF-LTF scan"
          git push
