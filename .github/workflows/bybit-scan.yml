name: Bybit HTF LTF Scan

on:
  workflow_dispatch:
  schedule:
    # 매일 한국시간 오전 9시
    - cron: "0 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run screener
        run: |
          python bybit_htf_ltf_screener.py \
            --max-symbols 160 \
            --min-turnover 5000000 \
            --top 15 \
            --output scan_results.csv

      - name: Build latest files
        run: |
          mkdir -p latest

          cp scan_results.csv latest/scan_results.csv
          cp scan_results_long.csv latest/scan_results_long.csv
          cp scan_results_short.csv latest/scan_results_short.csv

          python - <<'PY'
          import csv
          import json
          from datetime import datetime, timezone

          def read_csv(path):
              with open(path, "r", encoding="utf-8-sig") as f:
                  return list(csv.DictReader(f))

          def convert_value(value):
              if value is None or value == "":
                  return None

              lower = str(value).lower()

              if lower == "true":
                  return True

              if lower == "false":
                  return False

              try:
                  return float(value)
              except (ValueError, TypeError):
                  return value

          def clean(rows):
              return [
                  {
                      key: convert_value(value)
                      for key, value in row.items()
                  }
                  for row in rows
              ]

          full = clean(read_csv("scan_results.csv"))
          longs = clean(read_csv("scan_results_long.csv"))
          shorts = clean(read_csv("scan_results_short.csv"))

          data = {
              "ok": True,
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "source": "Bybit V5 via Cloudflare",
              "scan_method": "1D > 4H > 1H > 15m > 5m",
              "universe_count": len(full),
              "longs": longs,
              "shorts": shorts
          }

          with open(
              "latest/scan.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Created latest/scan.json")
          print("Universe:", len(full))
          print("Long candidates:", len(longs))
          print("Short candidates:", len(shorts))
          PY

      - name: Create Pages site
        run: |
          mkdir -p public/latest

          cp latest/scan.json public/latest/scan.json
          cp latest/scan_results.csv public/latest/scan_results.csv
          cp latest/scan_results_long.csv public/latest/scan_results_long.csv
          cp latest/scan_results_short.csv public/latest/scan_results_short.csv

          cat > public/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Bybit HTF LTF Screener</title>
          </head>
          <body>
            <h1>Bybit HTF/LTF Screener</h1>
            <p>Latest scan is available.</p>
            <p><a href="./latest/scan.json">Open latest scan.json</a></p>
          </body>
          </html>
          EOF

      - name: Save latest results to repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add latest/

          if git diff --cached --quiet; then
            echo "No repository changes"
          else
            git commit -m "Update latest Bybit scan"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
