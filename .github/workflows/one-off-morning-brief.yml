name: One-off Morning Brief Extract
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-off-morning-brief.yml']
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract held positions
        run: |
          jq -r '.positions | to_entries | map(.value.analysis | {symbol,last,price24h_pct,"1D":.["1D"],"4H":.["4H"],"1H":.["1H"],"15m":.["15m"],long_rr,short_rr,long_entry_model_ready,short_entry_model_ready,long_reasons,short_reasons})' latest/scan.json