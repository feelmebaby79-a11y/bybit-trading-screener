name: Realtime Watch Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest snapshots
        uses: actions/checkout@v4

      - name: Validate committed snapshot freshness and integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)
          max_age_seconds = 15 * 60
          watchlist_max_age_seconds = 24 * 60 * 60
          snapshots = []
          for filename in ('latest/realtime_watch.json', 'latest/entry_watch.json'):
              data = json.loads(Path(filename).read_text(encoding='utf-8'))
              if data.get('ok') is not True:
                  raise SystemExit(f'{filename}: ok is not true')
              if int(data.get('error_count', -1)) != 0:
                  raise SystemExit(f'{filename}: error_count={data.get("error_count")}')
              stamp = data.get('generated_at')
              if not stamp:
                  raise SystemExit(f'{filename}: missing generated_at')
              generated = datetime.fromisoformat(stamp.replace('Z', '+00:00')).astimezone(timezone.utc)
              age = (now - generated).total_seconds()
              print(f'{filename}: generated_at={generated.isoformat()} age_seconds={age:.0f} ok=true error_count=0', flush=True)
              if age < -120 or age > max_age_seconds:
                  raise SystemExit(f'{filename}: stale or future snapshot, age_seconds={age:.0f}')
              watchlist_stamp = data.get('watchlist_updated_at')
              if not watchlist_stamp:
                  raise SystemExit(f'{filename}: missing watchlist_updated_at')
              watchlist_time = datetime.fromisoformat(watchlist_stamp.replace('Z', '+00:00')).astimezone(timezone.utc)
              watchlist_age = (now - watchlist_time).total_seconds()
              if watchlist_age < -120 or watchlist_age > watchlist_max_age_seconds:
                  raise SystemExit(f'{filename}: stale watchlist, age_seconds={watchlist_age:.0f}')
              snapshots.append(data)
          if snapshots[0]['watchlist_updated_at'] != snapshots[1]['watchlist_updated_at']:
              raise SystemExit('snapshot watchlist timestamps do not match')
          print('SNAPSHOT_HEALTH_CHECK_OK')
          PY
